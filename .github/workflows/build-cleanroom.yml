name: Build Cleanroom 1.12.2

on:
  push:
    branches:
      - cleanroom-1.12.2-integration
    paths:
      - 'common/**'
      - 'docs/en/**'
      - 'targets/cleanroom-1.12.2/**'
      - 'scripts/build-target.ps1'
      - '.github/workflows/build-cleanroom.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Cleanroom target
        shell: pwsh
        run: .\scripts\build-target.ps1 -Target cleanroom-1.12.2
      - name: Upload Cleanroom mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: apricityui-cleanroom-1.12.2
          path: |
            targets/cleanroom-1.12.2/build/libs/apricityui-*.jar
            !targets/cleanroom-1.12.2/build/libs/*-dev.jar
            !targets/cleanroom-1.12.2/build/libs/*-sources.jar
            !targets/cleanroom-1.12.2/build/libs/*-plain.jar
          if-no-files-found: error
